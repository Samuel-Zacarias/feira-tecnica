<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar Professor | Feira Técnica</title>
  <link rel="stylesheet" href="css/painel.css">
</head>
<body>
<header>
  <div>
    <h1>Editar Professor</h1>
    <p>PUT protegido · Logado como <span data-professor>Professor</span></p>
  </div>
  <div class="top-actions">
    <a href="dashboard.html">Painel</a>
    <button type="button" data-sair>Sair</button>
  </div>
</header>
<main>

<section class="hero"><h2>Editar professor</h2><p>Selecione um professor, altere os dados e envie <strong>PUT /api/v1/professores/:id</strong>.</p></section>
<div id="alerta" class="alert"></div>
<form id="form">
  <fieldset><legend>Selecionar</legend><div class="field"><label>Professor</label><select id="professorId" required><option value="">Carregando...</option></select></div></fieldset>
  <div class="form-grid">
    <div class="field"><label>Nome</label><input id="nome" required minlength="3"></div>
    <div class="field"><label>E-mail</label><input id="email" type="email" required></div>
    <div class="field"><label>Nova senha (opcional)</label><input id="senha" type="password" placeholder="Deixe vazio para manter"></div>
    <div class="field"><label>Função</label><select id="role"><option>AVALIADOR</option><option>ADMINISTRADOR</option></select></div>
  </div>
  <div class="form-actions"><button class="btn sec" type="submit">Salvar alterações</button></div>
</form>

</main>
<script src="js/auth.js"></script>
<script>

const alerta=document.getElementById("alerta"), sel=document.getElementById("professorId");
let lista=[];
async function carregarLista(){
  try{
    const r=await api("/api/v1/professores"); lista=r.data.professores||[];
    sel.innerHTML='<option value="">Selecione...</option>'+lista.map(p=>`<option value="${escapeHtml(p.id)}">${escapeHtml(p.nome)} — ${escapeHtml(p.email)}</option>`).join("");
    const q=new URLSearchParams(location.search).get("id"); if(q){sel.value=q; preencher();}
  }catch(e){mostrarAlerta(alerta,"error",e.message);}
}
function preencher(){
  const p=lista.find(x=>x.id===sel.value); if(!p)return;
  nome.value=p.nome||""; email.value=p.email||""; role.value=p.role||"AVALIADOR"; senha.value="";
}
sel.addEventListener("change",preencher);
document.getElementById("form").addEventListener("submit",async e=>{
  e.preventDefault();
  if(!sel.value) return mostrarAlerta(alerta,"error","Selecione um professor.");
  const professor={nome:nome.value.trim(),email:email.value.trim(),role:role.value};
  if(senha.value) professor.senha=senha.value;
  try{
    const r=await api(`/api/v1/professores/${sel.value}`,{method:"PUT",body:JSON.stringify({professor})});
    mostrarAlerta(alerta,"ok",`✓ ${r.message}`);
    await carregarLista(); sel.value=r.data.professor?.id||sel.value; preencher();
  }catch(e){mostrarAlerta(alerta,"error",e.message);}
});
carregarLista();

</script>
</body>
</html>
