<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar Professor | Feira Técnica</title>
  <link rel="stylesheet" href="css/painel.css">
</head>
<body>
<header>
  <div>
    <h1>Cadastrar Professor</h1>
    <p>POST protegido · Logado como <span data-professor>Professor</span></p>
  </div>
  <div class="top-actions">
    <a href="dashboard.html">Painel</a>
    <button type="button" data-sair>Sair</button>
  </div>
</header>
<main>

<section class="hero"><h2>Novo professor</h2><p>Envia um <strong>POST /api/v1/professores</strong> com JWT e grava no MongoDB.</p></section>
<div id="alerta" class="alert"></div>
<form id="form">
  <div class="form-grid">
    <div class="field"><label>Nome</label><input id="nome" required minlength="3" placeholder="Nome do professor"></div>
    <div class="field"><label>E-mail</label><input id="email" type="email" required placeholder="professor@escola.com"></div>
    <div class="field"><label>Senha</label><input id="senha" type="password" required minlength="8" placeholder="Ex.: Professor@123"></div>
    <div class="field"><label>Função</label><select id="role"><option>AVALIADOR</option><option>ADMINISTRADOR</option></select></div>
  </div>
  <p class="help">A senha precisa ter 8+ caracteres, maiúscula, minúscula, número e caractere especial.</p>
  <div class="form-actions"><button class="btn ok" type="submit">Cadastrar professor</button><a class="btn light" href="professores-consulta.html">Ver professores</a></div>
</form>

</main>
<script src="js/auth.js"></script>
<script>

const form = document.getElementById("form");
const alerta = document.getElementById("alerta");
form.addEventListener("submit", async e => {
  e.preventDefault(); limparAlerta(alerta);
  try {
    const professor = {
      nome: nome.value.trim(), email: email.value.trim(),
      senha: senha.value, role: role.value
    };
    const r = await api("/api/v1/professores", { method:"POST", body:JSON.stringify({ professor }) });
    mostrarAlerta(alerta, "ok", `✓ ${r.message}. ID: ${r.data.professor.id}`);
    form.reset();
  } catch (e) { mostrarAlerta(alerta, "error", e.message); }
});

</script>
</body>
</html>
