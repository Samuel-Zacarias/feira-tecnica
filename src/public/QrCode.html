<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerador de QR Code</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, Helvetica, sans-serif;
            background: #eef4fa;
            color: #173f6d;
        }

        .card {
            width: 420px;
            max-width: 100%;
            background: white;
            border-radius: 18px;
            padding: 32px 28px;
            box-shadow: 0 10px 30px rgba(0, 60, 120, 0.10);
            text-align: center;
        }

        .cabecalho h1 {
            margin: 0 0 8px 0;
            color: #0759a8;
            font-size: 24px;
        }

        .cabecalho p {
            margin: 0 0 24px 0;
            color: #68798b;
            font-size: 14px;
        }

        .campo-grupo {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #dcefff;
            border-radius: 11px;
            background: #f8fbfe;
            color: #173f6d;
            font-size: 15px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #0867bd;
            background: #ffffff;
        }

        button {
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 11px;
            background: #0867bd;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #07529b;
        }

        .mensagem {
            min-height: 20px;
            margin-bottom: 10px;
            font-size: 14px;
            font-weight: bold;
        }

        .qr-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 250px;
            padding: 16px;
            background: #edf7ff;
            border: 2px dashed #72afe3;
            border-radius: 14px;
        }

        canvas {
            max-width: 100%;
            height: auto !important;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="cabecalho">
            <h1>Gerar QR Code</h1>
            <p>Digite a matricula do aluno</p>
        </div>

        <div class="campo-grupo">

            <input
                id="matricula"
                type="text"
                placeholder="Digite a matricula"
            >

            <button onclick="gerarQRCode()">
                Gerar QR Code
            </button>

        </div>

        <div id="mensagem" class="mensagem"></div>

        <div class="qr-container">
            <canvas id="qrcode"></canvas>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

    <script>

        async function gerarQRCode() {

            const matricula =
                document.getElementById("matricula").value.trim();

            const mensagem =
                document.getElementById("mensagem");

            const canvas =
                document.getElementById("qrcode");

            mensagem.textContent = "";

            const contexto = canvas.getContext("2d");
            contexto.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            if (!matricula) {
                mensagem.textContent =
                    "Digite uma matricula.";

                return;
            }

            try {

                const uri =
                    `http://localhost:3000/api/v1/projetos/buscar-matricula?matricula=${encodeURIComponent(matricula)}`;

                const response =
                    await fetch(uri);

                const dados =
                    await response.json();

                if (
                    !response.ok ||
                    !dados.data ||
                    !dados.data.encontrado
                ) {

                    mensagem.textContent =
                        "Matricula nao encontrada.";

                    return;
                }

                const projeto =
                    dados.data.projetos[0];

                const urlProjeto =
                    `http://localhost:3000/api/v1/projetos/publico/${projeto.projetoId}`;

                QRCode.toCanvas(
                    canvas,
                    urlProjeto,
                    {
                        width: 230,
                        margin: 2,
                        color: {
                            dark: "#173f6d",
                            light: "#ffffff"
                        }
                    },
                    function (erro) {

                        if (erro) {
                            console.error(erro);

                            mensagem.textContent =
                                "Erro ao gerar QR Code.";

                            return;
                        }

                        mensagem.textContent =
                            "QR Code gerado com sucesso.";
                    }
                );

            } catch (erro) {

                console.error(erro);

                mensagem.textContent =
                    "Erro ao consultar a matricula.";

            }
        }

    </script>

</body>

</html>
