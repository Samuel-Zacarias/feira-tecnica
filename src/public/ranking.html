<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ranking ao Vivo | Feira Técnica 2026</title>
  <link rel="stylesheet" href="css/publico.css">
</head>
<body>
<header class="topo">
  <div class="container topo-inner">
    <a class="marca" href="index.html">
      <img src="imagens/logo.png" alt="">
      <div>Feira Técnica<small>Ranking ao vivo</small></div>
    </a>
    <nav class="nav">
      <a class="botao secundario" href="index.html">Projetos</a>
      <a class="botao" href="login.html">Acesso interno</a>
    </nav>
  </div>
</header>

<section class="ranking-hero">
  <div class="container ranking-hero-grid">
    <div><span class="selo">AO VIVO</span><h1>Ranking.</h1><p>Classificação provisória dos projetos avaliados.</p></div>
    <div class="live-box">
      <span class="live-dot"></span>
      <div><strong>Atualização automática</strong><small id="ultima">Conectando...</small></div>
    </div>
  </div>
</section>

<main class="ranking-main">
  <div class="container">
    <section id="podio" class="podium"><div class="estado">Aguardando avaliações...</div></section>
    <section class="ranking-table-wrap">
      <div class="ranking-title"><div><h2>Classificação</h2></div><span class="ranking-refresh">Atualiza a cada 5 s</span></div>
      <div id="lista" class="ranking-list"><div class="estado">Carregando...</div></div>
    </section>
  </div>
</main>

<footer class="footer"><div class="container">Feira Técnica 2026 · classificação provisória</div></footer>

<script src="js/public-utils.js"></script>
<script>
const { escapeHtml, formatScore } = PublicUtils;

function medalha(posicao) {
  if (posicao === 1) return "🥇";
  if (posicao === 2) return "🥈";
  if (posicao === 3) return "🥉";
  return `#${posicao}`;
}

function render(ranking) {
  const top = ranking.slice(0, 3);
  document.getElementById("podio").innerHTML = top.length
    ? top.map(item => `
        <article class="podium-card pos-${item.posicao}">
          <div class="podium-medal">${medalha(item.posicao)}</div>
          <span>${escapeHtml(item.curso)}</span>
          <h2>${escapeHtml(item.tema)}</h2>
          <strong>${formatScore(item.media)}</strong>
          <small>${item.avaliacoes} ${item.avaliacoes === 1 ? "avaliação" : "avaliações"}</small>
          <a href="projeto.html?id=${encodeURIComponent(item.projetoId)}">Ver projeto →</a>
        </article>
      `).join("")
    : '<div class="estado">Ainda não há projetos classificados.</div>';

  document.getElementById("lista").innerHTML = ranking.length
    ? ranking.map(item => `
        <a class="ranking-row" href="projeto.html?id=${encodeURIComponent(item.projetoId)}">
          <div class="ranking-pos">${medalha(item.posicao)}</div>
          <div class="ranking-project"><strong>${escapeHtml(item.tema)}</strong><span>${escapeHtml(item.curso)}</span></div>
          <div class="ranking-count">${item.avaliacoes}<small>avaliações</small></div>
          <div class="ranking-score">${formatScore(item.media)}<small>média</small></div>
        </a>
      `).join("")
    : '<div class="estado">Nenhum projeto classificado.</div>';
}

async function atualizar() {
  try {
    const response = await fetch("/api/v1/avaliacoes/ranking/publico", { cache: "no-store" });
    const data = await response.json();
    if (!response.ok) throw new Error();

    render(data?.data?.ranking || []);
    document.getElementById("ultima").textContent = new Date(
      data?.data?.atualizadoEm || Date.now()
    ).toLocaleTimeString("pt-BR", {
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
    });
  } catch (_) {
    document.getElementById("ultima").textContent = "Reconectando...";
  }
}

atualizar();
setInterval(atualizar, 5000);
</script>
</body>
</html>
